site_name: Информатика ТУСУР
site_description: Материалы практических и лабораторных занятий по дисциплине «Информатика»
site_author: Валерий Семенюк
site_url: https://savaleriy.github.io/tusur-isit-informatics/

docs_dir: docs

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Светлая тема

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}

plugins:
  - search:
      lang:
        - ru
        - en

extra_css:
  - stylesheets/extra.css

hooks:
  - hooks/copy_data.py
  - hooks/mathjax.py

nav:
  - Главная: index.md
  - Приложение:
      - Bash: 00-appendix/bash.md
      - Git: 00-appendix/git.md
      - Как решать задачи: 00-appendix/HowToSolve.md
      - Python: 00-appendix/python.md
      - Настройка IDE: 00-appendix/simple-ide.md
  - 1. Информация и её представление:
      - Конспект: 01-intro/note.md
      - Python: 01-intro/python.md
      - Задачи: 01-intro/task.md
  - 2. Логика и комбинаторика:
      - Конспект: 02-logic/note.md
      - Python: 02-logic/python.md
      - Задачи: 02-logic/task.md
  - 3. Алгоритмы и сложность:
      - Конспект: 03-algorithms/note.md
      - Python: 03-algorithms/python.md
      - Задачи: 03-algorithms/task.md
  - 4. Структуры данных:
      - Конспект: 04-data-structures/note.md
      - Python: 04-data-structures/python.md
      - Задачи: 04-data-structures/task.md
  - 5. Стратегии решения задач:
      - Конспект: 05-strategies/note.md
      - Python: 05-strategies/python.md
      - Задачи: 05-strategies/task.md
  - "6. Лабораторная 1: игровой ИИ":
      - "Вариант A: UNO": 06-lab-game/UNO.md
      - "Вариант B: Морской бой": 06-lab-game/Battleship.md
  - 7. Деревья и сжатие данных:
      - Конспект: 07-trees/note.md
      - Python: 07-trees/python.md
      - Задачи: 07-trees/task.md
  - "8. Лабораторная 2: поиск пути": 08-lab-maze/maze.md
  - 9. Криптография и безопасность:
      - Конспект: 09-crypto/note.md
      - Python: 09-crypto/python.md
      - Задачи: 09-crypto/task.md
  - "10. Лабораторная 3: погоня на графе": 10-lab-hunter/Hunters.md
  - Контрольные точки:
      - Контрольная точка 1: Tests/cp_1.md
      - Контрольная точка 2: Tests/cp_2.md
  - Экзамен: 11-exam/exam_2025.md
  - AI Agenda: AI_AGENDA.md
  - Звёзды и оценивание: Students/stars.md
  - Успеваемость:
      - 2026: Students/2026.md
      - 2025: Students/2025.md
